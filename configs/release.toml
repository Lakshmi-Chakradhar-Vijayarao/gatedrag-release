# Baseline release configuration. temperature > 0 so that K runs differ (real run-to-run variation).
[pipeline]
top_k = 5
candidate_k = 20
use_bm25 = true
use_dense = false
use_rerank = false
acl_mode = "pre"
prompt_variant = "grounded"
temperature = 0.7
max_tokens = 256
verifier = "lexical"
regenerate = true
cost_wrong = 4.0
cost_abstain = 1.0
