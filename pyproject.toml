[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gatedrag"
version = "0.1.0"
description = "A RAG service with a runtime accept/regenerate/abstain guardrail and a release gate whose own error rates are measured."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Lakshmi Chakradhar Vijayarao"}]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "numpy>=1.26",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
]

[project.optional-dependencies]
dense = ["sentence-transformers>=2.6"]          # dense retrieval + cross-encoder reranking
local = ["transformers>=4.40", "torch>=2.2"]
review = ["openpyxl>=3.1"]                      # Excel review workbook    # small local model for development runs
dev = ["pytest>=8", "scipy>=1.11", "rank-bm25>=0.2.2", "ruff>=0.5", "mypy>=1.10"]   # rank-bm25: parity test only

[project.scripts]
gatedrag = "gatedrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E731", "E702"]

[tool.ruff.lint.isort]
known-first-party = ["gatedrag", "conftest"]   # same import order locally and on CI, from any folder
